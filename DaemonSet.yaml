apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
spec:
  selector:
    matchLabels:
      app: log-agent
  template:
    metadata:
      labels:
        app: log-agent
    spec:
      containers:
        - name: log-agent
          image: busybox:1.35.0-uclibc
          command:
            - "sh"
            - "-c"
            - |
              while [ -z "$(find /var/lib/kubelet/pods/ -path '*/volumes/kubernetes.io~empty-dir/logs/app.log')" ]; do
                sleep 2
              done
              find /var/lib/kubelet/pods/ -path '*/volumes/kubernetes.io~empty-dir/logs/app.log' | xargs cat
          volumeMounts:
            - name: pods
              mountPath: /var/lib/kubelet/pods
              readOnly: true
      volumes:
        - name: pods
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
